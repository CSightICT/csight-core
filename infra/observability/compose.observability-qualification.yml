name: csight-observability-qualification

x-csight-image: &csight-image
  image: csight-core:${CSIGHT_IMAGE_TAG:-dev}

x-hardened: &hardened
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - qualification

services:
  collector:
    image: otel/opentelemetry-collector-contrib@sha256:89107a3a8f4636a396927edf7025bb9614b8da2d92f4cc3f43109e8d115736e2
    command:
      - --config=/etc/otelcol-contrib/config.yml
    volumes:
      - ./collector.yml:/etc/otelcol-contrib/config.yml:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - qualification

  prometheus:
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - collector
      - alertmanager
    networks:
      - qualification

  alertmanager:
    image: prom/alertmanager@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - receiver
    networks:
      - qualification

  receiver:
    <<: [*csight-image, *hardened]
    command:
      - python
      - /qualification/observability_alert_receiver.py
    volumes:
      - ../../scripts:/qualification:ro
    tmpfs:
      - /tmp

  emitter:
    <<: [*csight-image, *hardened]
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    environment:
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: csight-observability-qualification
      OTEL_EXPORTER: otlp_http
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_TRACE_SAMPLE_RATIO: "1.0"
      OTEL_EXPORT_TIMEOUT_SECONDS: "1"
      OTEL_METRIC_EXPORT_INTERVAL_SECONDS: "5"
    depends_on:
      - collector
    tmpfs:
      - /tmp

  checker:
    <<: [*csight-image, *hardened]
    profiles:
      - tools
    entrypoint:
      - python
    volumes:
      - ../../scripts:/qualification:ro
    tmpfs:
      - /tmp

networks:
  qualification:
    internal: true

volumes:
  prometheus-data:
  alertmanager-data:
