<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"
     role="img" aria-labelledby="title desc">
  <title id="title">CSight 투자자용 시스템 아키텍처</title>
  <desc id="desc">
    고객 문의와 상품 이미지가 AI 증거 분석과 정책 근거 준비를 거쳐 인증된 상담원의 최종 결정으로
    이어지고, 외부 실행 전 확인 문서와 비식별 학습 자산으로 연결되는 CSight의 사람 중심 시스템
    아키텍처. 현재는 합성 정책과 상거래 문맥을 사용하는 내부 운영형 PoC이며 외부 환불, 결제,
    CRM, 물류, 메일 발송은 수행하지 않는다.
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="55%" stop-color="#0C1D34"/>
      <stop offset="100%" stop-color="#14233C"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D5DFB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="human" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D5DFB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="learning" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#073C45"/>
      <stop offset="100%" stop-color="#0F5B58"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.30"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#818CF8" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#8293AE"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#A5B4FC"/>
    </marker>
    <style>
      .font { font-family: 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 2.4px; fill: #91A4C2; }
      .title { font-size: 38px; font-weight: 850; letter-spacing: -1.2px; fill: #F8FAFC; }
      .subtitle { font-size: 17px; font-weight: 560; fill: #AFC0D9; }
      .surface-title { font-size: 20px; font-weight: 800; fill: #F8FAFC; }
      .surface-sub { font-size: 13px; font-weight: 570; fill: #C5D2E5; }
      .step { font-size: 12px; font-weight: 850; letter-spacing: 1.4px; fill: #A5B4FC; }
      .card-title { font-size: 21px; font-weight: 830; letter-spacing: -0.4px; fill: #F8FAFC; }
      .card-sub { font-size: 13px; font-weight: 580; fill: #AFC0D9; }
      .body { font-size: 13px; font-weight: 620; fill: #DBE5F3; }
      .body-muted { font-size: 12px; font-weight: 560; fill: #91A4C2; }
      .mini-title { font-size: 13px; font-weight: 800; fill: #E8EEF8; }
      .mini-copy { font-size: 11.5px; font-weight: 570; fill: #AFC0D9; }
      .human-title { font-size: 22px; font-weight: 850; fill: #FFFFFF; }
      .human-copy { font-size: 13px; font-weight: 620; fill: #E0E7FF; }
      .foundation-title { font-size: 14px; font-weight: 820; fill: #E8EEF8; }
      .foundation-copy { font-size: 11.5px; font-weight: 560; fill: #91A4C2; }
      .pill { font-size: 11.5px; font-weight: 800; }
      .scope { font-size: 12.5px; font-weight: 700; fill: #C9D6E8; }
      .footer { font-size: 11.5px; font-weight: 580; fill: #7185A3; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1425" cy="-45" r="330" fill="#4F46E5" opacity="0.10"/>
  <circle cx="-40" cy="900" r="310" fill="#0EA5A4" opacity="0.07"/>

  <!-- Header -->
  <text x="72" y="52" class="font eyebrow">CSIGHT · HUMAN-IN-THE-LOOP AI OPERATIONS</text>
  <text x="72" y="98" class="font title">AI가 근거를 준비하고, 사람이 결정하는 CS 운영 플랫폼</text>
  <text x="72" y="130" class="font subtitle">문의 접수부터 정책 근거, 최종 검토, 업무 문서와 학습 데이터까지 하나의 안전한 흐름으로 연결</text>

