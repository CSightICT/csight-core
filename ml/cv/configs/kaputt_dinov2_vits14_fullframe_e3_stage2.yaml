project_name: csight-kaputt-dinov2
run_name: dinov2-vits14-kaputt-fullframe-e3-stage2-b16
dataset_root: /home/data/datasets/kaputt/extracted
output_root: /home/data/csight-cv-runs
model_name: facebook/dinov2-small

seed: 42
image_size: 1024
batch_size: 16
gradient_accumulation_steps: 1
num_workers: 8
epochs: 12
learning_rate: 2.0e-6
classifier_learning_rate: 3.0e-5
linear_probe_learning_rate: 1.0e-3
weight_decay: 0.05
warmup_ratio: 0.02
early_stopping_patience: 4
gradient_checkpointing: false
mixed_precision: bf16
float32_matmul_precision: high
cudnn_benchmark: true
fused_optimizer: true
log_every_steps: 20

train_augmentation:
  resize_mode: full_frame
  horizontal_flip: 0.5
  vertical_flip: 0.5
  auto_augment: rand-m9-mstd0.5-inc1

wandb:
  entity: null
  tags:
    - csight
    - kaputt
    - dinov2
    - binary-defect-classification
    - full-frame-resize
    - stage2-continuation
    - batch16
  log_model_artifact: false

