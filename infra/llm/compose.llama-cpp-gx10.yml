name: csight-gx10-qwen38-dev

services:
  qwen38-llama-cpp:
    image: ${LLAMA_CPP_IMAGE:?digest-bound GX10 image required}
    pull_policy: never
    restart: "no"
    read_only: true
    init: true
    user: "${LLAMA_CPP_RUN_UID:?GX10 owner uid required}:${LLAMA_CPP_RUN_GID:?GX10 owner gid required}"
    pids_limit: 1024
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LLAMA_API_KEY: ${LLM_API_KEY:?private API key required}
    ports:
      - "${LLM_BIND_ADDRESS:?Tailscale bind required}:${LLAMA_CPP_PORT:-18002}:8080"
    volumes:
      - "${LLAMA_CPP_GGUF_ROOT:?content-addressed GGUF root required}:/models:ro"
    tmpfs:
      - /tmp:size=1g,mode=1777
    devices:
      - "nvidia.com/gpu=all"
    command:
      - --model
      - /models/${LLAMA_CPP_GGUF_FILENAME:?exact GGUF filename required}
      - --alias
      - ${LLM_MODEL_ID:?served model name required}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${LLAMA_CPP_CONTEXT_SIZE:-4096}
      - --parallel
      - ${LLAMA_CPP_PARALLEL:-1}
      - --batch-size
      - ${LLAMA_CPP_BATCH_SIZE:-512}
      - --ubatch-size
      - ${LLAMA_CPP_UBATCH_SIZE:-128}
      - --n-gpu-layers
      - ${LLAMA_CPP_GPU_LAYERS:-all}
      - --reasoning
      - ${LLAMA_CPP_REASONING:-off}
      - --no-reasoning-preserve
      - --flash-attn
      - ${LLAMA_CPP_FLASH_ATTN:-on}
      - --cache-type-k
      - ${LLAMA_CPP_KV_CACHE_TYPE_K:-q8_0}
      - --cache-type-v
      - ${LLAMA_CPP_KV_CACHE_TYPE_V:-q8_0}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 180s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      org.csight.execution-scope: GX10_CANARY_DEV_ONLY
      org.csight.publication-state: LOCAL_UNPUBLISHED
      org.csight.release-eligible: "false"
      org.csight.primary-allowed: "false"
      org.csight.core-routing: "false"
      org.csight.automatic-fallback: "false"
