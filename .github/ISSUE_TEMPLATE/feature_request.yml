name: Feature request
description: 사용자 또는 운영 문제를 해결하는 기능을 제안합니다.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제
      description: 구현안보다 먼저 사용자·운영 문제를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: 기대 가치
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 인수조건
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 범위 밖
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 아키텍처·보안 제약
      description: Port/Adapter, 정책·Human Review, 개인정보 영향을 기록해 주세요.
