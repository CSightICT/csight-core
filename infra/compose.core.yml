name: csight-core

x-app-image: &app-image
  image: csight-core:${CSIGHT_IMAGE_TAG:-dev}
  build:
    context: ..
    dockerfile: infra/docker/Dockerfile

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-csight-core-api}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  API_SCHEMA_VERSION: ${API_SCHEMA_VERSION:-1.0}
  READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-2}
  DATABASE_ECHO: ${DATABASE_ECHO:-false}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-csight}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-csight}
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-csight}:${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}@rabbitmq:5672//
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
  MINIO_BUCKET: ${MINIO_BUCKET:-csight-evidence}
  MINIO_REGION: ${MINIO_REGION:-us-east-1}
  MINIO_SECURE: "false"
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
  ALLOWED_IMAGE_MIME_TYPES: ${ALLOWED_IMAGE_MIME_TYPES:-image/jpeg,image/png,image/webp}
  ALLOWED_IMAGE_EXTENSIONS: ${ALLOWED_IMAGE_EXTENSIONS:-jpg,jpeg,png,webp}
  MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  VISION_PROVIDER: ${VISION_PROVIDER:-mock}
  VISION_MOCK_MODE: ${VISION_MOCK_MODE:-success_single_defect}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://llm.invalid}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL_ID: ${LLM_MODEL_ID:-csight-mock-llm}
  LLM_MODEL_VERSION: ${LLM_MODEL_VERSION:-0.1.0}
  LLM_MODEL_REVISION: ${LLM_MODEL_REVISION:-}
  LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-5}
  LLM_READ_TIMEOUT_SECONDS: ${LLM_READ_TIMEOUT_SECONDS:-120}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
  LLM_MAX_OUTPUT_CHARS: ${LLM_MAX_OUTPUT_CHARS:-20000}
  LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-20000}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
  LLM_TLS_VERIFY: "${LLM_TLS_VERIFY:-true}"
  VISION_BASE_URL: ${VISION_BASE_URL:-http://vision.invalid}
  VISION_API_KEY: ${VISION_API_KEY:-}
  VISION_MODEL_ID: ${VISION_MODEL_ID:-csight-mock-vision}
  VISION_MODEL_VERSION: ${VISION_MODEL_VERSION:-0.1.0}
  VISION_MODEL_REVISION: ${VISION_MODEL_REVISION:-}
  VISION_CONNECT_TIMEOUT_SECONDS: ${VISION_CONNECT_TIMEOUT_SECONDS:-5}
  VISION_READ_TIMEOUT_SECONDS: ${VISION_READ_TIMEOUT_SECONDS:-120}
  VISION_MAX_IMAGE_BYTES: ${VISION_MAX_IMAGE_BYTES:-10485760}
  VISION_TLS_VERIFY: "${VISION_TLS_VERIFY:-true}"
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:8091}
  EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
  RERANKER_BASE_URL: ${RERANKER_BASE_URL:-http://host.docker.internal:8092}
  RERANKER_TIMEOUT_SECONDS: ${RERANKER_TIMEOUT_SECONDS:-120}
  CELERY_TASK_MAX_RETRIES: ${CELERY_TASK_MAX_RETRIES:-3}
  CELERY_RETRY_BACKOFF_MAX_SECONDS: ${CELERY_RETRY_BACKOFF_MAX_SECONDS:-60}
  ANALYSIS_TASK_SOFT_TIME_LIMIT_SECONDS: ${ANALYSIS_TASK_SOFT_TIME_LIMIT_SECONDS:-150}
  ANALYSIS_TASK_HARD_TIME_LIMIT_SECONDS: ${ANALYSIS_TASK_HARD_TIME_LIMIT_SECONDS:-180}
  ANALYSIS_STAGE_LEASE_SECONDS: ${ANALYSIS_STAGE_LEASE_SECONDS:-300}
  ANALYSIS_OUTBOX_POLL_INTERVAL_SECONDS: ${ANALYSIS_OUTBOX_POLL_INTERVAL_SECONDS:-1}
  ANALYSIS_OUTBOX_BATCH_SIZE: ${ANALYSIS_OUTBOX_BATCH_SIZE:-100}
  ANALYSIS_OUTBOX_CLAIM_SECONDS: ${ANALYSIS_OUTBOX_CLAIM_SECONDS:-30}
  ANALYSIS_OUTBOX_MAX_ATTEMPTS: ${ANALYSIS_OUTBOX_MAX_ATTEMPTS:-10}
  ANALYSIS_OUTBOX_RETRY_BASE_SECONDS: ${ANALYSIS_OUTBOX_RETRY_BASE_SECONDS:-1}
  ANALYSIS_OUTBOX_RETRY_MAX_SECONDS: ${ANALYSIS_OUTBOX_RETRY_MAX_SECONDS:-60}

x-app-depends-on: &app-depends-on
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  minio:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully

services:
  api:
    <<: *app-image
    init: true
    command:
      - uv
      - run
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: *app-environment
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-csight-core}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-csight-api}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      MINIO_PRESIGNED_ENDPOINT: ${MINIO_PRESIGNED_ENDPOINT:-127.0.0.1:9000}
      MINIO_PRESIGNED_SECURE: "${MINIO_PRESIGNED_SECURE:-false}"
      SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-900}
    depends_on: *app-depends-on
    ports:
      - 127.0.0.1:${API_PORT:-8000}:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 20s
    networks:
      - core

  worker:
    <<: *app-image
    init: true
    command:
      - uv
      - run
      - celery
      - -A
      - app.interface.workers.celery_app:celery_app
      - worker
      - --loglevel=${LOG_LEVEL:-INFO}
      - --hostname=worker@%h
      - --queues=default,analysis,policy-retrieval
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    environment: *app-environment
    depends_on: *app-depends-on
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery -A app.interface.workers.celery_app:celery_app inspect ping
          --destination "worker@$$HOSTNAME" --timeout 5 | grep -q pong
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - core

  dispatcher:
    <<: *app-image
    init: true
    command:
      - uv
      - run
      - python
      - -m
      - app.interface.dispatchers.outbox
    environment: *app-environment
    depends_on: *app-depends-on
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os; os.kill(1, 0)
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s
    networks:
      - core

  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csight}
      POSTGRES_USER: ${POSTGRES_USER:-csight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - core

  rabbitmq:
    image: rabbitmq:4.1.8-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-csight}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - 127.0.0.1:${RABBITMQ_PORT:-5672}:5672
      - 127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - core

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_SITE_REGION: ${MINIO_REGION:-us-east-1}
    ports:
      - 127.0.0.1:${MINIO_PORT:-9000}:9000
      - 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s
    networks:
      - core

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - >-
        mc alias set csight http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY";
        mc mb --ignore-existing "csight/$$MINIO_BUCKET";
        mc anonymous set none "csight/$$MINIO_BUCKET"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-csight-evidence}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - core

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:

networks:
  core:
    driver: bridge
