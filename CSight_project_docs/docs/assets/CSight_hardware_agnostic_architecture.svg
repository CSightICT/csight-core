<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CSight Hardware-Agnostic Hybrid AI Service Architecture</title>
  <desc id="desc">A hardware-agnostic architecture diagram showing an operations web console, a core application and data plane, a secure private service network, and separate LLM and vision inference nodes.</desc>

  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="coreGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FBFF"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4F46E5"/>
    </marker>
    <style>
      .font { font-family: 'NanumSquare','Noto Sans CJK KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif; }
      .title { font-size: 30px; font-weight: 800; fill: #0F172A; letter-spacing: -0.4px; }
      .subtitle { font-size: 15px; font-weight: 500; fill: #64748B; }
      .layer-title { font-size: 21px; font-weight: 800; fill: #0F172A; }
      .layer-subtitle { font-size: 13px; font-weight: 600; fill: #64748B; }
      .card-title { font-size: 17px; font-weight: 800; fill: #1E293B; }
      .body { font-size: 14px; font-weight: 500; fill: #334155; }
      .small { font-size: 12.5px; font-weight: 600; fill: #64748B; }
      .pill { font-size: 12px; font-weight: 800; }
      .footer { font-size: 12px; font-weight: 700; fill: #64748B; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGradient)"/>

  <!-- Title -->
  <text x="800" y="38" text-anchor="middle" class="font title">CSight Hybrid AI Service Architecture</text>
  <text x="800" y="64" text-anchor="middle" class="font subtitle">하드웨어 독립형 배포 구조 · 업무 계층과 AI 추론 계층의 책임 분리</text>

  <!-- Operations Console -->
  <g id="operations-console" filter="url(#shadow)">
    <rect x="470" y="88" width="660" height="92" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="525" cy="134" r="24" fill="#EEF2FF" stroke="#C7D2FE"/>
    <rect x="514" y="123" width="22" height="15" rx="2" fill="none" stroke="#4F46E5" stroke-width="2"/>
    <line x1="520" y1="143" x2="530" y2="143" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
    <line x1="525" y1="138" x2="525" y2="143" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
    <text x="565" y="126" class="font layer-title">상담원용 웹 콘솔</text>
    <text x="565" y="151" class="font layer-subtitle">Case 검토 · 정책 근거 확인 · 승인 · 수정 · 이관</text>
    <rect x="945" y="111" width="142" height="34" rx="17" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="1016" y="133" text-anchor="middle" class="font pill" fill="#475569">Presentation Layer</text>
  </g>

  <!-- Console to Core Arrow -->
  <line x1="800" y1="181" x2="800" y2="218" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="729" y="188" width="142" height="25" rx="12.5" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="800" y="205" text-anchor="middle" class="font small">REST API · SSE</text>

  <!-- Core Application & Data Plane -->
  <g id="core-plane" filter="url(#shadow)">
    <rect x="130" y="225" width="1340" height="315" rx="28" fill="url(#coreGradient)" stroke="#93C5FD" stroke-width="1.7"/>

    <rect x="130" y="225" width="1340" height="72" rx="28" fill="#E0ECFF"/>
    <rect x="130" y="269" width="1340" height="28" fill="#E0ECFF"/>
    <circle cx="181" cy="261" r="22" fill="#DBEAFE" stroke="#93C5FD"/>
    <path d="M169 263h24M173 255h16M176 271h10" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linecap="round"/>
    <text x="220" y="255" class="font layer-title">Core Application &amp; Data Plane</text>
    <text x="220" y="279" class="font layer-subtitle">업무 상태, 정책, 데이터, 결정 이력의 단일 소유 지점</text>
    <rect x="1190" y="246" width="226" height="34" rx="17" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="1303" y="268" text-anchor="middle" class="font pill" fill="#1D4ED8">Control &amp; Data Plane</text>

    <!-- Core card 1 -->
    <g filter="url(#smallShadow)">
      <rect x="175" y="325" width="370" height="155" rx="18" fill="#FFFFFF" stroke="#D6E4F5"/>
      <circle cx="213" cy="362" r="18" fill="#EEF2FF"/>
      <path d="M204 362h18M208 356h10M208 368h10" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
      <text x="242" y="368" class="font card-title">API &amp; Orchestration</text>
      <text x="205" y="404" class="font body">• FastAPI Application API</text>
      <text x="205" y="430" class="font body">• Celery Analysis Worker</text>
      <text x="205" y="456" class="font small">요청 처리 · 비동기 작업 · 결과 통합</text>
    </g>

    <!-- Core card 2 -->
    <g filter="url(#smallShadow)">
      <rect x="615" y="325" width="370" height="155" rx="18" fill="#FFFFFF" stroke="#D6E4F5"/>
      <circle cx="653" cy="362" r="18" fill="#ECFDF5"/>
      <ellipse cx="653" cy="355" rx="10" ry="4.5" fill="none" stroke="#059669" stroke-width="2"/>
      <path d="M643 355v13c0 2.5 4.5 4.5 10 4.5s10-2 10-4.5v-13" fill="none" stroke="#059669" stroke-width="2"/>
      <path d="M643 361c0 2.5 4.5 4.5 10 4.5s10-2 10-4.5" fill="none" stroke="#059669" stroke-width="2"/>
      <text x="682" y="368" class="font card-title">Data &amp; Messaging</text>
      <text x="645" y="404" class="font body">• PostgreSQL + pgvector</text>
      <text x="645" y="430" class="font body">• RabbitMQ · Object Storage</text>
      <text x="645" y="456" class="font small">영속성 · 작업 전달 · 정책 문서 검색</text>
    </g>

    <!-- Core card 3 -->
    <g filter="url(#smallShadow)">
      <rect x="1055" y="325" width="370" height="155" rx="18" fill="#FFFFFF" stroke="#D6E4F5"/>
      <circle cx="1093" cy="362" r="18" fill="#FFF7ED"/>
      <path d="M1085 353h16v18h-16zM1089 349h8v4h-8z" fill="none" stroke="#EA580C" stroke-width="2" stroke-linejoin="round"/>
      <text x="1122" y="368" class="font card-title">Domain Capabilities</text>
      <text x="1085" y="404" class="font body">• Case · Policy · Workflow</text>
      <text x="1085" y="430" class="font body">• Review · Report · Audit</text>
      <text x="1085" y="456" class="font small">업무 규칙 · 승인 흐름 · 추적 가능성</text>
    </g>

    <rect x="433" y="495" width="734" height="28" rx="14" fill="#F8FAFC" stroke="#D8E2F0"/>
    <text x="800" y="514" text-anchor="middle" class="font footer">Single Source of Truth · 분석 결과와 최종 업무 결정의 버전 이력 보존</text>
  </g>

  <!-- Core to network -->
  <line x1="800" y1="540" x2="800" y2="570" stroke="#4F46E5" stroke-width="2.7" marker-end="url(#arrowBlue)"/>

  <!-- Secure network pill -->
  <g id="network" filter="url(#smallShadow)">
    <rect x="525" y="574" width="550" height="46" rx="23" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
    <circle cx="565" cy="597" r="13" fill="#EEF2FF"/>
    <path d="M559 597h12M565 591v12" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
    <text x="800" y="603" text-anchor="middle" class="font card-title">Secure Private Service Network</text>
  </g>

  <!-- Branch arrows to inference nodes -->
  <path d="M800 620 V638 H455 V660" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M800 620 V638 H1145 V660" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="650" y="628" width="300" height="24" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="800" y="645" text-anchor="middle" class="font small">Inference Request / Structured Result</text>

  <!-- LLM Inference Node -->
  <g id="llm-node" filter="url(#shadow)">
    <rect x="175" y="660" width="560" height="205" rx="24" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.8"/>
    <rect x="175" y="660" width="560" height="58" rx="24" fill="#F3E8FF"/>
    <rect x="175" y="694" width="560" height="24" fill="#F3E8FF"/>
    <circle cx="218" cy="689" r="19" fill="#EDE9FE" stroke="#C4B5FD"/>
    <path d="M209 681h18v16h-18zM214 677h8v4h-8zM214 697v5M222 697v5" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round"/>
    <text x="250" y="695" class="font layer-title">LLM Inference Node</text>
    <rect x="595" y="676" width="100" height="28" rx="14" fill="#FFFFFF" stroke="#D8B4FE"/>
    <text x="645" y="695" text-anchor="middle" class="font pill" fill="#7E22CE">vLLM</text>

    <text x="215" y="755" class="font body">• 문의 텍스트 구조화</text>
    <text x="215" y="783" class="font body">• 정책 근거 설명 및 RAG 응답</text>
    <text x="215" y="811" class="font body">• 상담원용 검토 보고서 생성</text>

    <rect x="215" y="826" width="480" height="25" rx="12.5" fill="#FAF5FF" stroke="#E9D5FF"/>
    <text x="455" y="843" text-anchor="middle" class="font footer">Stateless Inference · 데이터베이스 직접 접근 없음</text>
  </g>

  <!-- Vision Inference Node -->
  <g id="vision-node" filter="url(#shadow)">
    <rect x="865" y="660" width="560" height="205" rx="24" fill="#FFFFFF" stroke="#34D399" stroke-width="1.8"/>
    <rect x="865" y="660" width="560" height="58" rx="24" fill="#DCFCE7"/>
    <rect x="865" y="694" width="560" height="24" fill="#DCFCE7"/>
    <circle cx="908" cy="689" r="19" fill="#D1FAE5" stroke="#6EE7B7"/>
    <rect x="899" y="681" width="18" height="16" rx="2" fill="none" stroke="#059669" stroke-width="2"/>
    <circle cx="904" cy="686" r="2" fill="#059669"/>
    <path d="M901 695l5-5 4 4 3-3 3 4" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="940" y="695" class="font layer-title">Vision Inference Node</text>
    <rect x="1237" y="676" width="148" height="28" rx="14" fill="#FFFFFF" stroke="#A7F3D0"/>
    <text x="1311" y="695" text-anchor="middle" class="font pill" fill="#047857">FastAPI / Triton</text>

    <text x="905" y="755" class="font body">• 이미지 품질 및 입력 적합성 분석</text>
    <text x="905" y="783" class="font body">• 결함 Detection / Segmentation</text>
    <text x="905" y="811" class="font body">• 결함 위치 · 유형 · 신뢰도 반환</text>

    <rect x="905" y="826" width="480" height="25" rx="12.5" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="1145" y="843" text-anchor="middle" class="font footer">Stateless Inference · 데이터베이스 직접 접근 없음</text>
  </g>

  <!-- Bottom note -->
  <text x="800" y="892" text-anchor="middle" class="font small">모델·인프라 교체 시에도 Core 업무 로직과 데이터 계약을 유지하는 하드웨어 독립형 구조</text>
</svg>
