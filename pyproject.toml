[project]
name = "csight"
version = "0.1.0"
description = "CSight product-defect customer-service decision support foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.1",
    "celery==5.6.3",
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "kombu==5.6.2",
    "minio==7.2.20",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pillow==12.3.0",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.4",
    "pwdlib[argon2]==0.3.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.13.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.52",
    "starlette==1.6.0",
    "structlog==26.1.0",
    "urllib3==2.7.0",
    "uvicorn[standard]==0.52.3",
]

[dependency-groups]
dev = [
    "httpx2==2.10.0",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "unit: isolated unit tests",
    "integration: tests requiring local infrastructure",
    "contract: provider and external-boundary contract tests",
    "e2e: end-to-end application skeleton tests",
    "external_gpu: tests requiring an explicitly configured GPU provider",
    "external_vision: tests requiring an explicitly configured external Vision service",
    "external_embedding: tests requiring an explicitly configured embedding service",
    "external_reranker: tests requiring an explicitly configured reranker service",
    "external_local_llm: tests requiring the host-native Local MLX service",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["CSight_project_docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["app", "tests"]
exclude = ["CSight_project_docs"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
