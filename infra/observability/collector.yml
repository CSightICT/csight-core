receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  resource/metric-safety:
    attributes:
      - key: service.instance.id
        action: delete
  batch:
    send_batch_size: 128
    timeout: 1s

exporters:
  debug/traces:
    verbosity: detailed
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: false

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug/traces]
    metrics:
      receivers: [otlp]
      processors: [resource/metric-safety, batch]
      exporters: [prometheus]
