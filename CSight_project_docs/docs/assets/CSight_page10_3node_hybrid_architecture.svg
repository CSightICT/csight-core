<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="900" viewBox="0 0 1600 900"
     role="img" aria-labelledby="title desc">
  <title id="title">CSight 3-Node Hybrid Deployment Architecture</title>
  <desc id="desc">
    상담원용 웹 콘솔, Core Application and Data Plane, LLM Inference Node,
    Vision Inference Node로 구성된 CSight의 하드웨어 독립형 3-Node 배포 아키텍처.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>

    <linearGradient id="coreBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FBFF"/>
      <stop offset="100%" stop-color="#EDF4FF"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="11"
                    flood-color="#0F172A" flood-opacity="0.11"/>
    </filter>

    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5"
                    flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>

    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8.4" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>

    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8.4" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4F46E5"/>
    </marker>

    <style>
      .font {
        font-family: 'NanumGothic','Noto Sans CJK KR','Apple SD Gothic Neo',
                     'Malgun Gothic','NanumSquare',Arial,sans-serif;
      }
      .title { font-size: 31px; font-weight: 800; fill: #0F172A; letter-spacing: -0.5px; }
      .subtitle { font-size: 15px; font-weight: 600; fill: #64748B; }
      .section-title { font-size: 21px; font-weight: 800; fill: #172033; }
      .section-sub { font-size: 13px; font-weight: 600; fill: #64748B; }
      .card-title { font-size: 17px; font-weight: 800; fill: #1E293B; }
      .body { font-size: 14px; font-weight: 540; fill: #334155; }
      .small { font-size: 12.5px; font-weight: 650; fill: #64748B; }
      .pill { font-size: 12px; font-weight: 800; }
      .principle { font-size: 13px; font-weight: 750; fill: #334155; }
      .footer { font-size: 12px; font-weight: 650; fill: #64748B; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#background)"/>

  <!-- Page heading -->
  <text x="800" y="42" text-anchor="middle" class="font title">
    CSight 3-Node Hybrid Deployment Architecture
  </text>
  <text x="800" y="68" text-anchor="middle" class="font subtitle">
    Core Application &amp; Data Plane과 AI Inference Plane의 책임 분리
  </text>

  <!-- Presentation layer -->
  <g id="presentation" >
    <rect x="520" y="90" width="560" height="82" rx="22"
          fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="567" cy="131" r="22" fill="#EEF2FF" stroke="#C7D2FE"/>
    <rect x="557" y="122" width="20" height="14" rx="2"
          fill="none" stroke="#4F46E5" stroke-width="2"/>
    <line x1="562" y1="140" x2="572" y2="140"
          stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
    <line x1="567" y1="136" x2="567" y2="140"
          stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
    <text x="603" y="126" class="font section-title">상담원용 웹 콘솔</text>
    <text x="603" y="150" class="font section-sub">
      Case 조회 · 근거 확인 · 승인 · 수정 · 이관
    </text>
    <rect x="916" y="113" width="126" height="32" rx="16"
          fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="979" y="134" text-anchor="middle" class="font pill" fill="#475569">
      Presentation
    </text>
  </g>

  <!-- Web to Core -->
  <line x1="800" y1="173" x2="800" y2="208"
        stroke="#64748B" stroke-width="2.5"
        marker-end="url(#arrowSlate)"/>
  <rect x="725" y="179" width="150" height="24" rx="12"
        fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="800" y="196" text-anchor="middle" class="font small">
    REST API · SSE
  </text>

  <!-- Core Application & Data Plane -->
  <g id="core" >
    <rect x="95" y="215" width="1410" height="355" rx="28"
          fill="url(#coreBg)" stroke="#93C5FD" stroke-width="1.8"/>

    <!-- Core header -->
    <path d="M123 215 H1477 Q1505 215 1505 243 V287 H95 V243 Q95 215 123 215 Z"
          fill="#E0ECFF"/>
    <circle cx="143" cy="251" r="21" fill="#DBEAFE" stroke="#93C5FD"/>
    <path d="M132 251h22M136 244h14M136 258h14"
          fill="none" stroke="#2563EB" stroke-width="2.3"
          stroke-linecap="round"/>
    <text x="181" y="247" class="font section-title">Core Application &amp; Data Plane</text>
    <text x="181" y="270" class="font section-sub">
      Case 상태·정책·분석 결과·검토 이력의 단일 소유 지점
    </text>
    <rect x="1212" y="235" width="244" height="34" rx="17"
          fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="1334" y="257" text-anchor="middle"
          class="font pill" fill="#1D4ED8">
      Control &amp; Data Plane
    </text>

    <!-- Card 1: FastAPI service -->
    <g >
      <rect x="135" y="312" width="385" height="175" rx="18"
            fill="#FFFFFF" stroke="#D6E4F5"/>
      <circle cx="176" cy="350" r="18" fill="#EEF2FF"/>
      <path d="M167 343h18v14h-18zM171 339h10v4h-10z"
            fill="none" stroke="#4F46E5" stroke-width="2"
            stroke-linejoin="round"/>
      <text x="205" y="356" class="font card-title">FastAPI Service Layer</text>
      <text x="166" y="391" class="font body">• 문의 접수 및 Case API</text>
      <text x="166" y="418" class="font body">• 정책·검토·보고서 API</text>
      <text x="166" y="445" class="font body">• 인증·상태 조회·SSE 알림</text>
      <text x="166" y="470" class="font small">요청을 빠르게 수락하고 장시간 작업은 분리</text>
    </g>

    <!-- Card 2: Async orchestration -->
    <g >
      <rect x="607" y="312" width="385" height="175" rx="18"
            fill="#FFFFFF" stroke="#D6E4F5"/>
      <circle cx="648" cy="350" r="18" fill="#FFF7ED"/>
      <path d="M640 350h16M648 342v16"
            stroke="#EA580C" stroke-width="2.2" stroke-linecap="round"/>
      <text x="677" y="356" class="font card-title">Async AI Orchestration</text>
      <text x="638" y="391" class="font body">• Celery Worker</text>
      <text x="638" y="418" class="font body">• RabbitMQ 작업 큐·재시도</text>
      <text x="638" y="445" class="font body">• LLM·Vision 병렬 호출 및 결과 결합</text>
      <text x="638" y="470" class="font small">Idempotency · Timeout · Partial Failure 관리</text>
    </g>

    <!-- Card 3: Data and governance -->
    <g >
      <rect x="1079" y="312" width="385" height="175" rx="18"
            fill="#FFFFFF" stroke="#D6E4F5"/>
      <circle cx="1120" cy="350" r="18" fill="#ECFDF5"/>
      <ellipse cx="1120" cy="344" rx="10" ry="4.5"
               fill="none" stroke="#059669" stroke-width="2"/>
      <path d="M1110 344v13c0 2.5 4.5 4.5 10 4.5s10-2 10-4.5v-13"
            fill="none" stroke="#059669" stroke-width="2"/>
      <path d="M1110 350c0 2.5 4.5 4.5 10 4.5s10-2 10-4.5"
            fill="none" stroke="#059669" stroke-width="2"/>
      <text x="1149" y="356" class="font card-title">Data &amp; Governance</text>
      <text x="1110" y="391" class="font body">• PostgreSQL + pgvector</text>
      <text x="1110" y="418" class="font body">• MinIO Object Storage</text>
      <text x="1110" y="445" class="font body">• Policy · Workflow · Review · Audit</text>
      <text x="1110" y="470" class="font small">업무 데이터와 모델·정책 버전 이력 보존</text>
    </g>

    <!-- Internal flow -->
    <line x1="520" y1="399" x2="593" y2="399"
          stroke="#94A3B8" stroke-width="2.3"
          marker-end="url(#arrowSlate)"/>
    <line x1="992" y1="399" x2="1065" y2="399"
          stroke="#94A3B8" stroke-width="2.3"
          marker-end="url(#arrowSlate)"/>

    <rect x="412" y="514" width="776" height="34" rx="17"
          fill="#F8FAFC" stroke="#D8E2F0"/>
    <text x="800" y="536" text-anchor="middle" class="font principle">
      Single Source of Truth · AI 분석과 최종 업무 결정의 버전 이력을 분리·보존
    </text>
  </g>

  <!-- Core to secure network -->
  <line x1="800" y1="570" x2="800" y2="602"
        stroke="#4F46E5" stroke-width="2.7"
        marker-end="url(#arrowIndigo)"/>

  <!-- Secure service network -->
  <g id="network" >
    <rect x="500" y="606" width="600" height="46" rx="23"
          fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
    <circle cx="541" cy="629" r="13" fill="#EEF2FF"/>
    <path d="M535 629h12M541 623v12"
          stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
    <text x="800" y="635" text-anchor="middle"
          class="font card-title">
      Secure Private Service Network
    </text>
  </g>

  <!-- Network to nodes -->
  <path d="M800 652 V670 H440 V688"
        fill="none" stroke="#64748B" stroke-width="2.5"
        marker-end="url(#arrowSlate)"/>
  <path d="M800 652 V670 H1160 V688"
        fill="none" stroke="#64748B" stroke-width="2.5"
        marker-end="url(#arrowSlate)"/>
  <rect x="646" y="659" width="308" height="25" rx="12.5"
        fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="800" y="676" text-anchor="middle" class="font small">
    Inference Request ↔ Structured Result
  </text>

  <!-- LLM inference node -->
  <g id="llm" >
    <rect x="145" y="688" width="590" height="170" rx="24"
          fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.8"/>
    <path d="M169 688 H711 Q735 688 735 712 V739 H145 V712 Q145 688 169 688 Z"
          fill="#F3E8FF"/>
    <circle cx="190" cy="716" r="18" fill="#EDE9FE" stroke="#C4B5FD"/>
    <path d="M181 708h18v16h-18zM186 704h8v4h-8z"
          fill="none" stroke="#7C3AED" stroke-width="2"
          stroke-linejoin="round"/>
    <text x="220" y="722" class="font section-title">LLM Inference Node</text>
    <rect x="602" y="702" width="94" height="28" rx="14"
          fill="#FFFFFF" stroke="#D8B4FE"/>
    <text x="649" y="721" text-anchor="middle"
          class="font pill" fill="#7E22CE">vLLM</text>

    <text x="184" y="770" class="font body">• 문의 구조화 · 고객 요청 추출</text>
    <text x="184" y="797" class="font body">• RAG 기반 정책 근거 설명</text>
    <text x="184" y="824" class="font body">• 상담원용 검토 보고서 생성</text>

    <rect x="474" y="767" width="222" height="58" rx="14"
          fill="#FAF5FF" stroke="#E9D5FF"/>
    <text x="585" y="789" text-anchor="middle" class="font small">
      Stateless Inference
    </text>
    <text x="585" y="811" text-anchor="middle" class="font small">
      Database Direct Access 없음
    </text>
  </g>

  <!-- Vision inference node -->
  <g id="vision" >
    <rect x="865" y="688" width="590" height="170" rx="24"
          fill="#FFFFFF" stroke="#34D399" stroke-width="1.8"/>
    <path d="M889 688 H1431 Q1455 688 1455 712 V739 H865 V712 Q865 688 889 688 Z"
          fill="#DCFCE7"/>
    <circle cx="910" cy="716" r="18" fill="#D1FAE5" stroke="#6EE7B7"/>
    <rect x="901" y="708" width="18" height="16" rx="2"
          fill="none" stroke="#059669" stroke-width="2"/>
    <circle cx="906" cy="713" r="2" fill="#059669"/>
    <path d="M903 722l5-5 4 4 3-3 3 4"
          fill="none" stroke="#059669" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="940" y="722" class="font section-title">Vision Inference Node</text>
    <rect x="1276" y="702" width="142" height="28" rx="14"
          fill="#FFFFFF" stroke="#A7F3D0"/>
    <text x="1347" y="721" text-anchor="middle"
          class="font pill" fill="#047857">FastAPI / Triton</text>

    <text x="904" y="770" class="font body">• 이미지 품질 및 입력 적합성 분석</text>
    <text x="904" y="797" class="font body">• 결함 Detection / Segmentation</text>
    <text x="904" y="824" class="font body">• 결함 유형 · 위치 · 신뢰도 반환</text>

    <rect x="1194" y="767" width="222" height="58" rx="14"
          fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="1305" y="789" text-anchor="middle" class="font small">
      Stateless Inference
    </text>
    <text x="1305" y="811" text-anchor="middle" class="font small">
      Database Direct Access 없음
    </text>
  </g>

  <!-- Bottom principles -->
  <rect x="250" y="870" width="1100" height="23" rx="11.5"
        fill="#FFFFFF" stroke="#D8E2F0"/>
  <text x="800" y="886" text-anchor="middle" class="font footer">
    비동기 처리 · 모델 서버 무상태화 · DB 접근 차단 · 모델·프롬프트·정책 버전 기록
  </text>
</svg>
